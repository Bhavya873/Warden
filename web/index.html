<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Warden</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Warden</h1>
  <div class="layout">
    <div class="floor-area">
      <canvas id="floor" width="600" height="600"></canvas>
      <div id="split-floors" class="split-floors">
        <div class="split-floor">
          <h3>Naive</h3>
          <canvas id="floor-naive" width="380" height="380"></canvas>
        </div>
        <div class="split-floor">
          <h3>Warden</h3>
          <canvas id="floor-warden" width="380" height="380"></canvas>
        </div>
      </div>
    </div>
    <div class="controls">
      <div class="control">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="warden">Warden</option>
          <option value="naive">Naive</option>
          <option value="split">Split (Naive vs Warden)</option>
        </select>
      </div>
      <div class="control">
        <label for="robot-count">
          Robots: <span id="robot-count-value">20</span>
          <span class="hint">(drag to the high end for a density stress test)</span>
        </label>
        <input id="robot-count" type="range" min="1" max="150" value="20" />
      </div>
      <div class="control">
        <label for="grid-size">Grid size: <span id="grid-size-value">30</span></label>
        <input id="grid-size" type="range" min="10" max="40" value="30" />
      </div>
      <div class="control">
        <label for="broadcast-lag">
          Broadcast lag
          <span class="hint">(Warden filter refresh interval — no effect in Naive mode)</span>
        </label>
        <select id="broadcast-lag">
          <option value="normal">Normal</option>
          <option value="degraded">Degraded</option>
          <option value="adversarial">Adversarial</option>
        </select>
      </div>
      <p id="connection-status"><span id="connection-text">connecting&hellip;</span> <span id="stat-tick"></span></p>
    </div>
  </div>

  <div class="dashboard">
    <dl class="totals" id="totals-single">
      <div class="total">
        <dt>Total moves</dt>
        <dd id="total-moves">0</dd>
      </div>
      <div class="total">
        <dt>Total confirm-checks</dt>
        <dd id="total-confirmed">0</dd>
      </div>
      <div class="total">
        <dt>Total conflicts avoided</dt>
        <dd id="total-conflicts">0</dd>
      </div>
      <div class="total total-near-miss">
        <dt>Total near-misses</dt>
        <dd id="total-near-misses">0</dd>
      </div>
    </dl>

    <div class="totals-split" id="totals-split">
      <div class="totals-column">
        <h4>Naive</h4>
        <dl class="totals">
          <div class="total"><dt>Moves</dt><dd id="split-naive-total-moves">0</dd></div>
          <div class="total"><dt>Confirmed</dt><dd id="split-naive-total-confirmed">0</dd></div>
          <div class="total"><dt>Conflicts avoided</dt><dd id="split-naive-total-conflicts">0</dd></div>
          <div class="total total-near-miss"><dt>Near-misses</dt><dd id="split-naive-total-near-misses">0</dd></div>
        </dl>
      </div>
      <div class="totals-column">
        <h4>Warden</h4>
        <dl class="totals">
          <div class="total"><dt>Moves</dt><dd id="split-warden-total-moves">0</dd></div>
          <div class="total"><dt>Confirmed</dt><dd id="split-warden-total-confirmed">0</dd></div>
          <div class="total"><dt>Conflicts avoided</dt><dd id="split-warden-total-conflicts">0</dd></div>
          <div class="total total-near-miss"><dt>Near-misses</dt><dd id="split-warden-total-near-misses">0</dd></div>
        </dl>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <canvas id="mix-chart"></canvas>
      </div>
      <div class="chart-box">
        <canvas id="load-chart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="grid_view.js"></script>
</body>
</html>
