<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="console-header">
    <div class="title-block">
      <h1>Warden</h1>
    </div>
    <div class="header-status">
      <span id="live-dot" class="live-dot"></span>
      <span id="connection-text">connecting&hellip;</span>
      <span id="stat-tick" class="mono"></span>
    </div>
  </header>

  <main class="layout">
    <section class="floor-area">
      <div class="split-floors">
        <div class="split-floor">
          <h3><span class="dot dot-naive"></span>Baseline <span class="board-desc">— server-side decisions</span></h3>
          <canvas id="floor-naive" width="460" height="460"></canvas>
        </div>
        <div class="split-floor">
          <h3><span class="dot dot-warden"></span>Warden <span class="board-desc">— local-first decisions</span></h3>
          <canvas id="floor-warden" width="460" height="460"></canvas>
        </div>
      </div>
      <ul class="legend">
        <li><span class="swatch swatch-moved"></span>Moved</li>
        <li title="Waiting on a round trip to the server before it can move">
          <span class="swatch swatch-waiting"></span>Waiting
        </li>
        <li title="The server found this cell already taken and blocked the move">
          <span class="swatch swatch-conflict"></span>Conflict caught
        </li>
        <li title="The local filter said this cell was free, but the server's check caught that it wasn't — no collision happened">
          <span class="swatch swatch-near-miss"></span>Near-miss
        </li>
      </ul>
    </section>

    <aside class="controls">
      <div class="control">
        <label for="robot-count">
          Robots <span class="mono value" id="robot-count-value">20</span>
        </label>
        <input id="robot-count" type="range" min="1" max="150" value="20" />
      </div>
      <div class="control">
        <label for="grid-size">
          Grid size <span class="mono value" id="grid-size-value">30</span>
        </label>
        <input id="grid-size" type="range" min="10" max="40" value="30" />
      </div>
      <div class="control">
        <label for="broadcast-lag" title="How often Warden's local filter refreshes — no effect on the Baseline board">
          Broadcast lag
        </label>
        <select id="broadcast-lag">
          <option value="normal">Normal</option>
          <option value="degraded">Degraded</option>
          <option value="adversarial">Adversarial</option>
        </select>
      </div>
    </aside>
  </main>

  <section class="dashboard">
    <div class="totals-split">
      <div class="totals-column">
        <h4><span class="dot dot-naive"></span>Baseline</h4>
        <dl class="totals">
          <div class="total"><dt>Moves</dt><dd class="mono" id="split-naive-total-moves">0</dd></div>
          <div class="total"><dt title="Moves that needed a round trip to the server">Checked</dt><dd class="mono" id="split-naive-total-confirmed">0</dd></div>
          <div class="total"><dt title="The server found a real conflict and blocked the move">Conflicts caught</dt><dd class="mono" id="split-naive-total-conflicts">0</dd></div>
          <div class="total total-near-miss"><dt title="Filter said free, server's check caught it was wrong — no collision happened">Near-misses</dt><dd class="mono" id="split-naive-total-near-misses">0</dd></div>
        </dl>
      </div>
      <div class="totals-column">
        <h4><span class="dot dot-warden"></span>Warden</h4>
        <dl class="totals">
          <div class="total"><dt>Moves</dt><dd class="mono" id="split-warden-total-moves">0</dd></div>
          <div class="total"><dt title="Moves that needed a round trip to the server">Checked</dt><dd class="mono" id="split-warden-total-confirmed">0</dd></div>
          <div class="total"><dt title="The server found a real conflict and blocked the move">Conflicts caught</dt><dd class="mono" id="split-warden-total-conflicts">0</dd></div>
          <div class="total total-near-miss"><dt title="Filter said free, server's check caught it was wrong — no collision happened">Near-misses</dt><dd class="mono" id="split-warden-total-near-misses">0</dd></div>
        </dl>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <canvas id="mix-chart"></canvas>
      </div>
      <div class="chart-box">
        <canvas id="load-chart"></canvas>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="grid_view.js"></script>
</body>
</html>
